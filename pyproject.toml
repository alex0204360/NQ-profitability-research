[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nq-profitability-research"
version = "0.1.0"
description = "Causal NQ take-profit/stop-loss policy research with a 45-minute cap"
requires-python = ">=3.12"
dependencies = ["numpy==2.3.5", "pandas==2.2.3", "scipy==1.17.0", "scikit-learn==1.8.0", "threadpoolctl==3.6.0", "pyarrow==25.0.1", "kagglehub==1.0.2", "pandas-market-calendars==5.4.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.6", "build==1.6.0"]

[project.scripts]
nqprofit = "nqprofit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["nqprofit"]

[tool.ruff]
line-length = 100
target-version = "py312"
